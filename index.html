<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeWalk Pro</title>
<style>
#splash{position:fixed;inset:0;background:#a855f7;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:sans-serif}
#splash h1{margin:10px 0 0 0}
body{margin:0;background:#f5f3ff;font-family:sans-serif}
.box{text-align:center;padding-top:100px}
button{padding:12px 20px;background:#a855f7;color:#fff;border:0;border-radius:10px;margin:5px}
</style>
</head>
<body>
<div id="splash"><div style="font-size:70px">🛡️</div><h1>SafeWalk Pro</h1><p>Loading...</p></div>
<div class="box">
<h2>SafeWalk Pro Ready</h2>
<p>App tayar hai</p>
<button onclick="bol()">🔊 Bolo</button>
</div>
<script>
function bol(){
  let t=new SpeechSynthesisUtterance("Assalamualaikum, app tayar hai");
  t.lang="ur-PK";t.rate=0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(t);
}
window.onload=function(){
  setTimeout(function(){
    let s=document.getElementById('splash');
    s.style.opacity='0';s.style.transition='0.6s';
    setTimeout(function(){s.style.display='none';bol();},600);
  },2000);
}
</script>
</body>
</html>
