<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeWalk - Women Safety</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fdf2f8;min-height:100vh;padding:20px}
.container{max-width:400px;margin:0 auto;background:white;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
h1{text-align:center;color:#be185d;margin-bottom:20px}
.card{background:#fff1f2;padding:15px;border-radius:15px;margin-bottom:15px;border:1px solid #fecdd3}
.card h3{color:#be185d;margin-bottom:10px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px}
button{width:100%;padding:12px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.btn-save{background:#be185d;color:white}
.btn-sos{background:#dc2626;color:white;font-size:18px;padding:16px}
.btn-fake{background:#f59e0b;color:white}
.btn-location{background:#059669;color:white}
.contact-item{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;border:1px solid #eee}
.primary{border:2px solid #be185d;background:#fff1f2}
.badge{background:#be185d;color:white;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:5px}
#fakeScreen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#111;color:white;justify-content:center;align-items:center;flex-direction:column;z-index:999}
</style>
</head>
<body>
<div class="container">
<h1>🌸 SafeWalk</h1>
<div class="card">
<h3>🚨 Emergency Contacts (3)</h3>
<input id="nameInput" placeholder="Naam (Ammi)">
<input id="numberInput" placeholder="Number 03XX-XXXXXXX">
<button class="btn-save" onclick="saveContact()">Contact Save Karein</button>
<div id="contactList"></div>
<p id="msg" style="color:green;text-align:center"></p>
</div>
<div class="card">
<h3>🆘 Emergency Help</h3>
<button class="btn-sos" onclick="sendSOS()">SOS - Police 15</button>
<button class="btn-location" onclick="shareLocation()">📍 Location WhatsApp</button>
<button class="btn-fake" onclick="startFakeCall()">📞 Papa ki Call</button>
<p id="status" style="text-align:center;margin-top:10px"></p>
</div>
</div>
<div id="fakeScreen">
<h2 style="font-size:30px">📞 Papa ki Call Aa Rahi Hai...</h2>
<p style="margin:20px">Baba Jaan 👨 Ringing...</p>
<audio id="ringtone" loop><source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<button onclick="endFakeCall()" style="width:200px;background:red;color:white;padding:15px;border-radius:30px;margin-top:30px">Call Cut</button>
</div>
<script>
let contacts = JSON.parse(localStorage.getItem('safeContacts') || '[]');
let primaryIndex = parseInt(localStorage.getItem('primaryIndex') || '0');
function saveContact(){
 let name=document.getElementById('nameInput').value.trim();
 let number=document.getElementById('numberInput').value.trim();
 if(!name||!number){alert("Naam aur Number likho");return;}
 if(contacts.length>=3){alert("Sirf 3 contacts! Pehle koi delete karo");return;}
 contacts.push({name,number});
 localStorage.setItem('safeContacts',JSON.stringify(contacts));
 document.getElementById('nameInput').value=''; document.getElementById('numberInput').value='';
 document.getElementById('msg').innerText='Save Ho Gaya!'; showContacts();
}
function showContacts(){
 let list=document.getElementById('contactList'); list.innerHTML='';
 contacts.forEach((c,i)=>{
  let div=document.createElement('div'); div.className='contact-item '+(i==primaryIndex?'primary':'');
  div.innerHTML=`<span>${c.name} - ${c.number} ${i==primaryIndex?'<span class=badge>Primary</span>':''}</span><span><button onclick="makePrimary(${i})" style="width:auto;padding:4px 8px;background:#be185d;color:white;border-radius:6px">Primary</button> <button onclick="deleteContact(${i})" style="width:auto;padding:4px 8px;background:#ddd;border-radius:6px">X</button></span>`;
  list.appendChild(div);
 });
}
function makePrimary(i){primaryIndex=i; localStorage.setItem('primaryIndex',i); showContacts();}
function deleteContact(i){contacts.splice(i,1); if(primaryIndex>=contacts.length) primaryIndex=0; localStorage.setItem('safeContacts',JSON.stringify(contacts)); localStorage.setItem('primaryIndex',primaryIndex); showContacts();}
function sendSOS(){window.location.href="tel:15";}
function shareLocation(){
 if(contacts.length==0){alert("Pehle contact save karo");return;}
 if(navigator.geolocation){
  document.getElementById('status').innerText="Location le rahi hun...";
  navigator.geolocation.getCurrentPosition(pos=>{
   let link=`https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
   let primary=contacts[primaryIndex]||contacts[0];
   let cleanNum=primary.number.replace(/[^0-9]/g,'');
   if(cleanNum.startsWith('03')) cleanNum='92'+cleanNum.substring(1);
   window.open(`https://wa.me/${cleanNum}?text=${encodeURIComponent("HELP! Meri location: "+link)}`,'_blank');
   document.getElementById('status').innerText="Location bhej di!";
  });
 }
}
function startFakeCall(){
 document.getElementById('fakeScreen').style.display='flex';
 document.getElementById('ringtone').play().catch(()=>{});
 let msg = new SpeechSynthesisUtterance("Papa ki call aa rahi hai");
 msg.lang = 'ur-PK';
 msg.rate = 0.9;
 speechSynthesis.speak(msg);
}
function endFakeCall(){
 document.getElementById('fakeScreen').style.display='none';
 document.getElementById('ringtone').pause();
 speechSynthesis.cancel();
}
showContacts();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister()));}
</script>
</body>
</html>
